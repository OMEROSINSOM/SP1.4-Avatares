<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Perfiles</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Contenedor Principal de la SPA -->
    <div id="app">
        <!-- Navegación Superior -->
        <header class="navbar">
            <h1 class="brand">Generador de Perfiles</h1>
            <nav id="main-nav">
                <a href="#/crear" class="nav-link active">Crear Perfil</a>
                <a href="#/galeria" class="nav-link">Galería</a>
            </nav>
        </header>
        <!-- Contenedor Dinámico: Aquí controlamos las vistas -->
        <main id="router-view">
            <!-- ========================================== -->
            <!-- MÓDULO DE CREACIÓN DE PERFIL      -->
            <!-- ========================================== -->
            <div id="view-create" class="view-module active">
                <div class="view-create-profile">
                    
                    <!-- Panel Izquierdo: Controles y Formularios -->
                    <section class="form-container">
                        <h2>Diseña tu Perfil</h2>

                        <!-- Consumo de API (GitHub) -->
                        <div class="api-search-block">
                            <div class="input-group">
                                <label for="github-search">Autocompletar desde</label>
                                <select id="api-select" class="api-select">
                                    <option value="GitHub">GitHub</option>
                                    <option value="GitLab">GitLab</option>
                                </select>
                            </div>
                            <div class="input-group-row">
                                <input type="text" id="github-search" placeholder="Usuario (Ej. octocat)">
                                <button type="button" id="btn-fetch" class="btn-secondary">Buscar</button>
                            </div>
                            <span id="api-status" class="status-msg"></span>
                        </div>
                        <hr>
                        <!-- Entrada Manual -->
                        <form id="profile-form">
                            <!-- Selector de Avatares -->
                            <div class="input-group">
                                <label>Elige un Avatar</label>
                                <div id="avatar-selector" class="avatar-grid">
                                    <!-- Los avatares se inyectarán aquí con JavaScript -->
                                </div>
                                <img src="src/assets/AddAvatar.png" onClick="openModal()" class="avatar-add" alt="Agregar Avatar Personalizado", title="Agregar Avatar Personalizado">
                            </div>
                            <div class="input-group">
                                <label for="input-name">Nombre a mostrar</label>
                                <input type="text" id="input-name" placeholder="Tu Nombre">
                            </div>
                            
                            <div class="input-group">
                                <label for="input-bio">Biografía</label>
                                <textarea id="input-bio" rows="3" placeholder="Cuéntanos sobre ti..."></textarea>
                            </div>

                            <div class="input-group">
                                <label for="input-color">Color de acento</label>
                                <input type="color" id="input-color" value="#3b82f6">
                            </div>

                            <button type="submit" class="btn-primary" onclick="">Guardar Tarjeta</button>
                        </form>
                    </section>

                    <!-- Panel Derecho: Previsualización en Tiempo Real -->
                    <section class="card-container">
                        <article id="profile-card" class="card">
                            <div class="card-header" id="preview-header"></div>
                            <img id="avatar-preview" src="src/assets/Avatar1.png" alt="Avatar" class="avatar">
                            <div class="card-body">
                                <h3 id="name-preview">Nombre Apellido</h3>
                                <p id="bio-preview">La biografía aparecerá aquí...</p>
                            </div>
                        </article>
                    </section>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- VISTA 2: MÓDULO DE GALERÍA         -->
            <!-- ========================================== -->
            <div id="view-gallery" class="view-module" style="display: none;">
                <div class="gallery-header">
                    <h2>Perfiles Guardados</h2>
                    <button id="btn-reload-gallery" class="btn-secondary">Actualizar Galería</button>
                </div>
                <!-- Aquí JavaScript inyectará todas las tarjetas guardadas en el JSON -->
                <div id="gallery-container" class="gallery-grid">
                    <p class="status-msg status-loading">Cargando tarjetas...</p>
                </div>
            </div> 
        </main>
    </div>
    <div id="custom-avatar-modal" class="modal hidden">
        <div class="modal-content">
              <div class="modal-header">
                 <h2>Avatar Personalizado</h2>
                 <button class="close-modal" id="close-custom-avatar" onclick="closeModal()">&times;</button>
             </div>
            <div class="modal-body">
                <form id="custom-avatar-form">
                    <div id="upload-area" class="upload-area">
                        <label for="custom-avatar-file" id="upload-label">Arrastra tu imagen aquí</label>
                        <input type="file" id="custom-avatar-file" accept="image/*" hidden>
                        <image id="custom-avatar-preview" src="#" alt="Vista previa del avatar" class="hidden">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="save-custom-avatar">Guardar</button>
                <button class="btn-secondary" id="cancel-custom-avatar " onclick="closeModal()">Cancelar</button>
             </div>
        </div>
    </div>
    <div class="blurred-background hidden"></div>
    <!-- Script de lógica -->
    <script src="js/events.js"></script>
</body>
</html>
